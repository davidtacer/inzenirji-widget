<!doctype html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Plačilo — urejevalnik Inženirji.si</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; text-align: center; line-height: 1.5; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      button { margin-top: 16px; min-height: 44px; padding: 0 20px; font: inherit; border-radius: 10px; border: 1px solid #1f7a4d; background: #1f7a4d; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Plačilo je uspelo</h1>
      <p id="text">Dobroimetje je dodano v nekaj sekundah. Zaprite ta zavihek in se vrnite v urejevalnik. Račun ste prejeli po e-pošti.</p>
      <button type="button" onclick="window.close()">Zapri zavihek</button>
    </main>
    <script>
      if (new URLSearchParams(location.search).get("status") === "cancel") {
        document.getElementById("title").textContent = "Plačilo je preklicano";
        document.getElementById("text").textContent = "Nič ni bilo zaračunano. Zaprite ta zavihek in se vrnite v urejevalnik.";
      }
    </script>
  </body>
</html>
